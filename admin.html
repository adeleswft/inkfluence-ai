<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkfluence AI — Analytics Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e2e8f0; padding: 24px; min-height: 100vh; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 32px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; text-align: center; }
    .stat-number { font-size: 2rem; font-weight: 700; color: #7c3aed; }
    .stat-label { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    .section { margin-bottom: 32px; }
    .section h2 { font-size: 1.1rem; margin-bottom: 12px; color: #cbd5e1; }
    table { width: 100%; border-collapse: collapse; background: #111827; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
    th { background: #1e293b; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 16px; text-align: left; }
    td { padding: 10px 16px; border-top: 1px solid #1e293b; font-size: 0.85rem; }
    tr:hover td { background: rgba(124,58,237,0.05); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; }
    .badge-view { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-click { background: rgba(234,179,8,0.15); color: #facc15; }
    .badge-form { background: rgba(34,197,94,0.15); color: #4ade80; }
    .bar-chart { margin-top: 16px; }
    .bar-row { display: flex; align-items: center; margin-bottom: 8px; }
    .bar-label { width: 140px; font-size: 0.85rem; color: #cbd5e1; flex-shrink: 0; }
    .bar-track { flex: 1; height: 24px; background: #1e293b; border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #a78bfa); border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-size: 0.75rem; font-weight: 600; min-width: 30px; }
    .actions { margin-bottom: 24px; display: flex; gap: 12px; }
    .btn { padding: 8px 16px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .btn:hover { border-color: #7c3aed; }
    .btn-danger { border-color: #dc2626; color: #f87171; }
    .btn-danger:hover { background: rgba(220,38,38,0.1); }
    .empty { text-align: center; padding: 40px; color: #64748b; }
    @media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <h1>Inkfluence AI — Analytics</h1>
  <p class="subtitle">Self-hosted dashboard. Data stored in your browser's localStorage.</p>

  <div class="actions">
    <button class="btn" onclick="refreshDashboard()">Refresh</button>
    <button class="btn" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-danger" onclick="clearData()">Clear All Data</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="section">
    <h2>Views by Page</h2>
    <div id="pageViews" class="bar-chart"></div>
  </div>

  <div class="section">
    <h2>Top Clicks</h2>
    <div id="topClicks" class="bar-chart"></div>
  </div>

  <div class="section">
    <h2>Recent Activity</h2>
    <table>
      <thead><tr><th>Time</th><th>Type</th><th>Page</th><th>Detail</th></tr></thead>
      <tbody id="recentActivity"></tbody>
    </table>
  </div>

  <script>
  function getData() {
    try { return JSON.parse(localStorage.getItem('inkfluence_analytics')) || { views: [], clicks: [], forms: [] }; }
    catch(e) { return { views: [], clicks: [], forms: [] }; }
  }

  function timeAgo(iso) {
    var diff = Date.now() - new Date(iso).getTime();
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
    return Math.floor(diff/86400000) + 'd ago';
  }

  function countBy(arr, key) {
    var counts = {};
    arr.forEach(function(item) { var k = item[key]; counts[k] = (counts[k] || 0) + 1; });
    return Object.entries(counts).sort(function(a,b) { return b[1] - a[1]; });
  }

  function barHTML(items, max) {
    if (!items.length) return '<div class="empty">No data yet</div>';
    return items.map(function(item) {
      var pct = Math.max(5, (item[1] / max) * 100);
      return '<div class="bar-row"><span class="bar-label">' + item[0] + '</span><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%">' + item[1] + '</div></div></div>';
    }).join('');
  }

  function refreshDashboard() {
    var data = getData();
    var views = data.views.length;
    var clicks = data.clicks.length;
    var forms = data.forms.length;
    var sessions = new Set(data.views.map(function(v) { return v.session; })).size;

    document.getElementById('stats').innerHTML =
      '<div class="stat-card"><div class="stat-number">' + views + '</div><div class="stat-label">Page Views</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + sessions + '</div><div class="stat-label">Unique Visitors</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + clicks + '</div><div class="stat-label">Link Clicks</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + forms + '</div><div class="stat-label">Form Submissions</div></div>';

    var pageCounts = countBy(data.views, 'page');
    var maxPage = pageCounts.length ? pageCounts[0][1] : 1;
    document.getElementById('pageViews').innerHTML = barHTML(pageCounts, maxPage);

    var clickLabels = data.clicks.map(function(c) { return c.label.substring(0, 40); });
    var clickCounts = {};
    clickLabels.forEach(function(l) { clickCounts[l] = (clickCounts[l] || 0) + 1; });
    var topClicks = Object.entries(clickCounts).sort(function(a,b) { return b[1] - a[1]; }).slice(0, 10);
    var maxClick = topClicks.length ? topClicks[0][1] : 1;
    document.getElementById('topClicks').innerHTML = barHTML(topClicks, maxClick);

    var all = [];
    data.views.forEach(function(v) { all.push({ time: v.time, type: 'view', page: v.page, detail: 'from ' + (v.referrer || 'direct') }); });
    data.clicks.forEach(function(c) { all.push({ time: c.time, type: 'click', page: c.page, detail: c.label }); });
    data.forms.forEach(function(f) { all.push({ time: f.time, type: 'form', page: f.page, detail: f.form }); });
    all.sort(function(a,b) { return b.time > a.time ? 1 : -1; });
    all = all.slice(0, 50);

    var rows = all.map(function(item) {
      var cls = item.type === 'view' ? 'badge-view' : item.type === 'click' ? 'badge-click' : 'badge-form';
      return '<tr><td>' + timeAgo(item.time) + '</td><td><span class="badge ' + cls + '">' + item.type + '</span></td><td>' + item.page + '</td><td>' + item.detail + '</td></tr>';
    }).join('');

    document.getElementById('recentActivity').innerHTML = rows || '<tr><td colspan="4" class="empty">No activity yet</td></tr>';
  }

  function exportCSV() {
    var data = getData();
    var csv = 'time,type,page,detail,session\n';
    data.views.forEach(function(v) { csv += v.time+',view,"'+v.page+'","'+(v.referrer||'direct')+'",'+v.session+'\n'; });
    data.clicks.forEach(function(c) { csv += c.time+',click,"'+c.page+'","'+c.label.replace(/"/g,'""')+'",'+c.session+'\n'; });
    data.forms.forEach(function(f) { csv += f.time+',form,"'+f.page+'","'+f.form+'",'+f.session+'\n'; });
    var blob = new Blob([csv], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'inkfluence-analytics-' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
  }

  function clearData() {
    if (confirm('Delete all analytics data? This cannot be undone.')) {
      localStorage.removeItem('inkfluence_analytics');
      refreshDashboard();
    }
  }

  refreshDashboard();
  </script>

</body>
</html>
